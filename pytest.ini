[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
markers =
    unit: Unit tests (service layer, calculations, validators)
    integration: Integration tests (API endpoints, multi-tenancy, security)
    slow: Tests that take longer to run
